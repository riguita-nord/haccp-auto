<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HACCP Auto — Gestão alimentar</title><link rel="stylesheet" href="/style.css"></head><body><div id="toast" role="status"></div><main id="login" class="auth"><div class="auth-card"><div class="mark">✳</div><div class="eyebrow">SEGURANÇA ALIMENTAR</div><h1>HACCP <em>Auto</em></h1><p>Registos fiáveis. Menos tarefas administrativas.</p><form id="loginForm"><label>Utilizador<input name="username" autocomplete="username" required></label><label>Palavra-passe<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Entrar no painel →</button></form><small>O acesso é reservado a utilizadores autorizados.</small></div></main><div id="app" hidden><aside class="sidebar"><div class="brand"><span class="mark">✳</span><span>HACCP <b>Auto</b><small>GESTÃO DO ESTABELECIMENTO</small></span></div><nav id="nav"></nav><div class="nav-bottom"><div id="identity"></div><button id="logout" class="ghost">Terminar sessão</button></div></aside><section class="workspace"><header class="top"><div><small>PAINEL DE CONTROLO</small><h1 id="heading">Dashboard</h1></div><span id="today"></span></header><div id="content"></div></section></div><dialog id="modal"><form id="editor"><div class="modal-head"><div><small>NOVO REGISTO</small><h2 id="modalTitle"></h2></div><button class="ghost" type="button" id="close">✕</button></div><div id="fields" class="form-grid"></div><footer><button type="button" class="ghost" id="cancel">Cancelar</button><button type="submit" class="primary">Guardar registo</button></footer></form></dialog><script src="/app.js" defer></script></body></html>
